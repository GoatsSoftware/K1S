syntax = "proto3";

package leaderboard;

service LeaderboardService {
  rpc RecordScore(RecordScoreRequest) returns (RecordScoreResponse);
  rpc GetTopScores(GetTopScoresRequest) returns (GetTopScoresResponse);
}

message RecordScoreRequest {
  string player_name = 1;
  uint32 score = 2;
}

message RecordScoreResponse {
  bool success = 1;
  string message = 2;
}

message GetTopScoresRequest {
  uint32 limit = 1;
}

message ScoreEntry {
  string player_name = 1;
  uint32 score = 2;
  int64 timestamp = 3;
}

message GetTopScoresResponse {
  repeated ScoreEntry scores = 1;
}
